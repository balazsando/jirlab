run:
  timeout: 3m

linters:
  enable:
    - gofmt
    - goimports
    - errcheck
    - staticcheck
    - govet
    - unused
    - misspell
    - gocritic

linters-settings:
  goimports:
    local-prefixes: github.com/andob/jirlab

issues:
  exclude-rules:
    # Allow unhandled errors in Start() calls for fire-and-forget GUI launchers
    - path: internal/tui/modal\.go
      linters: [errcheck]
      text: "cmd.Start"
